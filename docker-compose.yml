services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ml_network

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - ml_network

  scheduler:
    #image: ghcr.io/dask/dask:latest 
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: dask_scheduler
    hostname: scheduler  # Ensure hostname is explicit
    ports:
      - "8787:8787"
      - "8786:8786"
    command: ["dask-scheduler"]
    networks:
      - ml_network
    # ADDED: Healthcheck so the worker knows when to start
    healthcheck:
      test: ["CMD", "dask", "scheduler", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
      # ADDED: Pass the version as an arg to ensure sync during build
      args:
        DASK_VERSION: "2024.12.0" 
    dns:               # <--- ADD THIS SECTION
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      scheduler:
        condition: service_healthy # Wait for scheduler healthcheck to pass
    environment:
      - DASK_SCHEDULER_ADDRESS=tcp://scheduler:8786
    # ADDED: --nthreads allows you to control resource usage better
    command: ["dask-worker", "tcp://scheduler:8786", "--nthreads", "2"] 
    networks:
      - ml_network

networks:
  ml_network:
    driver: bridge

volumes:
  mongo_data:
  minio_data: